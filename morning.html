        <script>
            let currentAudio = null;

            function playSong(songId) {
                const selectedSong = document.getElementById(songId);

                if (!selectedSong) {
                    console.error("Could not find an audio element with ID:", songId);
                    return;
                }

                if (currentAudio && currentAudio !== selectedSong) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }

                if (selectedSong.paused) {
                    selectedSong.play()
                        .then(() => {
                            currentAudio = selectedSong;
                        })
                        .catch((error) => {
                            console.error("Playback failed. Try opening the page over a local web server.", error);
                        });
                } else {
                    selectedSong.pause();
                    currentAudio = null;
                }
            }
        </script>
