<html>
    <head>
        <link rel="icon" type="image/png" href="images/icon.png">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
<body>
    <div class="overlay-container">
      <img src="images/night.png" class="edge-image">
      <h1 class="morning1">The Evening</h1>
    </div>

    <div class="hero-image-wrap">
        <img src="images/evening.png" class="hero-image">

        <div class="poem">
          <div class="stanza">
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="line">The sky is dark,</a>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="line">The sun is gone,</a>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="line">It's time for bed,</a>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="line">Everyone said,</a>
          </div>

          <div class="stanza">
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="line">The stars stay hiding,</a>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="line">Wait some time,</a>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="line">Then they crawl out,</a>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" class="line">And turn into something sublime,</a>
          </div>
        </div>
    </div>

    <a href="witching hour.html" class="witch-button">&lt;here&gt;</a>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        background: #041326;
      }

      .overlay-container {
        position: relative;
        text-align: center;
      }

      .morning1 {
        color: white;
        font-size: 80px;
        font-weight: 600;
        position: absolute;
        top: 10%;
        left: 10%;
        transform: translate(-50%, -50%);
        z-index: 1;
        margin-left: 10%;
      }

      .edge-image {
        width: 100%;
        height: auto;
        display: block;
        position: relative;
        z-index: -1;
      }

      .hero-image-wrap {
        position: relative;
        width: 100%;
        background: #081b34;
      }

      .hero-image {
        width: 100%;
        height: auto;
        display: block;
      }

      .poem {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(8, 27, 52, 0.25);
        padding: 20px;
      }

      .stanza {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        margin-bottom: 18px;
      }

      .line {
        display: block;
        text-decoration: none;
        color: #f5f5f5;
        font-family: Georgia, serif;
        font-size: 28px;
        line-height: 1.7;
        text-align: center;
        background: transparent;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .line:hover {
        opacity: 0.8;
        transform: translateX(4px);
      }

      .witch-button {
        display: inline-block;
        margin: 18px auto;
        padding: 12px 22px;
        background-color: #0b1f3a;
        color: #0b1f3a;
        text-decoration: none;
        border: 2px solid #0b1f3a;
        border-radius: 10px;
        font-weight: bold;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .witch-button:hover {
        background-color: #ffd400;
        color: #0b1f3a;
      }

      .witch-button:active {
        background-color: #f0c400;
      }
    </style>
</body>
</html>
